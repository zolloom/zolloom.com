name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Secrets are encrypted
        run: |
          fail=0
          for f in $(git ls-files 'secrets/*'); do
            grep -q '^sops:' "$f" || { echo "NOT ENCRYPTED: $f"; fail=1; }
          done
          if git ls-files | grep -E '(^|/)\.decrypted~'; then echo "plaintext sops copy committed"; fail=1; fi
          exit $fail
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: node node_modules/@playwright/test/cli.js install --with-deps chromium
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7

